name: Package Soloist test runtime
on:
  push:
    branches: [main]
    paths: [Dockerfile.soloist-runtime, .github/workflows/soloist-runtime.yml]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.soloist-runtime
          platforms: linux/amd64
          push: true
          tags: ghcr.io/chaseb64/cadence:soloist-runtime
